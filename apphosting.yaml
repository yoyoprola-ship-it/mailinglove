# Firebase App Hosting config for mailinglove.
#
# minInstances: 0 on purpose — this is a pre-launch waitlist site with
# little to no traffic yet. Scaling to zero means an occasional cold
# start (a few seconds) for the first visitor after an idle period,
# instead of paying for a container to sit idle 24/7. Revisit once
# there's real, steady traffic to justify the always-on cost.
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 1024 # image buffers + the OpenAI SDK need more headroom than 512

env:
  # Canonical public origin — payment return URLs, etc.
  - variable: PUBLIC_URL
    value: https://mailinglove.com
    availability:
      - RUNTIME

  # --- OpenAI (image redesign) ---
  # Set with: firebase apphosting:secrets:set OPENAI_API_KEY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  # These are DEFAULTS only — the admin panel (config/app in Firestore)
  # overrides them at runtime without a redeploy.
  - variable: OPENAI_IMAGE_MODEL
    value: gpt-image-1.5 # supports input_fidelity, ~20% cheaper than gpt-image-1
    availability:
      - RUNTIME
  - variable: OPENAI_IMAGE_QUALITY
    value: medium
    availability:
      - RUNTIME
  - variable: OPENAI_IMAGE_SIZE
    value: 1024x1536
    availability:
      - RUNTIME
  - variable: OPENAI_IMAGE_INPUT_FIDELITY
    value: high # preserve faces/features from the uploaded photo
    availability:
      - RUNTIME

  # --- Admin panel: 2FA login (SMS + email codes) ---
  - variable: ADMIN_SESSION_SECRET
    secret: ADMIN_SESSION_SECRET
    availability:
      - RUNTIME
  - variable: ADMIN_EMAIL
    secret: ADMIN_EMAIL
    availability:
      - RUNTIME
  - variable: ADMIN_PHONE
    secret: ADMIN_PHONE
    availability:
      - RUNTIME
  - variable: TWILIO_ACCOUNT_SID
    secret: TWILIO_ACCOUNT_SID
    availability:
      - RUNTIME
  - variable: TWILIO_AUTH_TOKEN
    secret: TWILIO_AUTH_TOKEN
    availability:
      - RUNTIME
  - variable: TWILIO_SMS_FROM
    secret: TWILIO_SMS_FROM
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_FROM
    secret: RESEND_FROM
    availability:
      - RUNTIME

  # --- Payments (Stripe + PayPal) ---
  # Create the secrets first (firebase apphosting:secrets:set NAME), then deploy.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: PAYPAL_CLIENT_ID
    secret: PAYPAL_CLIENT_ID
    availability:
      - RUNTIME
  - variable: PAYPAL_CLIENT_SECRET
    secret: PAYPAL_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: PAYPAL_WEBHOOK_ID
    secret: PAYPAL_WEBHOOK_ID
    availability:
      - RUNTIME
  - variable: PAYPAL_ENV
    value: sandbox # switch to "live" for real payments
    availability:
      - RUNTIME
